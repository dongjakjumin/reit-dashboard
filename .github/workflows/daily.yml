# Collects once per weekday, rebuilds the pages, and publishes them to GitHub Pages.
# GitHub can start scheduled runs hours late or drop them when its queue is busy, so each weekday is
# scheduled three times. A run whose KST date already has a snapshot stops at the gate (manual runs too,
# unless recollect is ticked), so the source site is still contacted at most once a day.
# The collected data is committed right after collection, so a failed check blocks the deploy
# but never loses that day's data.
name: daily
on:
  schedule:
    - cron: "17 1 * * 1-5"   # 10:17 KST Mon-Fri, off the top of the hour when the queue is busiest
    - cron: "37 3 * * 1-5"   # 12:37 KST, backup if the first run was dropped or failed before saving
    - cron: "57 6 * * 1-5"   # 15:57 KST, second backup
  workflow_dispatch:
    inputs:
      deploy_only:
        description: "Rebuild and deploy from committed data without contacting the source site"
        type: boolean
        default: false
      recollect:
        description: "Collect again even if today's data already exists (a second source access that day)"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          DEPLOY_ONLY: ${{ inputs.deploy_only }}
          RECOLLECT: ${{ inputs.recollect }}
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          hour=$(TZ=Asia/Seoul date +%-H)
          run=true
          # Runs in this group never overlap, so an earlier run of the day has already pushed its snapshot.
          if [ "$DEPLOY_ONLY" = "true" ]; then
            echo "deploy only: the source site is not contacted"
          elif [ "$EVENT" = "schedule" ] && [ "$hour" -lt 10 ]; then
            # The earliest schedule is 10:17 KST, so a scheduled run starting before 10 is yesterday's run
            # delayed past midnight. It must not take today's collection.
            echo "::notice::scheduled run started at ${hour}h KST; skipping"
            run=false
          elif [ -f "data/snapshots/$today.json" ] && [ "$RECOLLECT" != "true" ]; then
            echo "::notice::data for $today is already collected; skipping"
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
  build:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # always the branch tip, also for runs that waited in the queue
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        if: ${{ !inputs.deploy_only }}
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python collect.py
      - name: Check data for credentials
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python verify.py --secrets-only
      - name: Commit data
        if: ${{ !inputs.deploy_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data change"
            exit 0
          fi
          git commit -m "data: $(TZ=Asia/Seoul date +%F)"
          # Someone may have pushed while this run was collecting: replay the data commit on top and retry.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "push failed after 3 attempts" >&2
          exit 1
      - name: Check calculator engine
        run: python tests/calc_check.py
      - name: Build
        run: python build.py
      - name: Verify
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          VERIFY_OFFLINE: ${{ inputs.deploy_only && '1' || '' }}
        run: python verify.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
